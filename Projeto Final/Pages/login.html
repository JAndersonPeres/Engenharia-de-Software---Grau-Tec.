<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Agência Norta | Login</title>
        <link rel="stylesheet" href="..\style.css">
    </head>
    <body class="page-style flex columns items-center">
        <div>
            <input type="checkbox" id="check">
            <label for="check">
                <span class="menu-icon">☰</span>
            </label>
            <div class="sidebar">
                <header>Menu</header>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
        <h1 class="text-title slim-text bigger-text compress-text compress-line mg-bottom-small">Login</h1>
        <div class="normal-container">
            <form class="flex columns">
                <label class="mg-bottom-smaller uppercase small-text">Email</label>
                <input type="email" placeholder="Digite seu email" class="mg-bottom-small large-height gray-bg border-solid circle-border">
                <label class="mg-bottom-smaller uppercase small-text">Senha</label>
                <input type="password" placeholder="Digite sua senha" class="mg-bottom-big large-height gray-bg border-solid circle-border">
                <button class="dark-green-bg remove-border large-height slim-text uppercase">Entrar</button>
            </form>
        </div>
        <footer>
            <p>Sistema desenvolvido para gestão da Agência Norta</p>
        </footer>
    </body>
</html>
